services:
  redis:
    image: redis:7.4.0-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  test-runner:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      target: test
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
