[project]
name = "loitering-detector"
version = "0.3.0"
description = "Real-time computer vision system for loitering detection and tracking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "redis>=7.4.0",
    "lapx>=0.5.12",
    "yt-dlp>=2026.3.17",
    "supervision>=0.29.1",
]

[project.optional-dependencies]
# Display Support (mutually exclusive choices for local vs production runner)
gui = [
    "opencv-python>=4.13.0.92",
    "ultralytics>=8.4.94",
]
headless = [
    "opencv-python-headless>=4.13.0.92",
    "ultralytics-opencv-headless>=8.4.94",
]

# Hardware Acceleration Backends (coupled with uv sources routing below)
cpu = [
    "onnxruntime>=1.24.4,<1.27.0",
    "torch",
    "torchvision",
]
gpu = [
    "onnxruntime-gpu>=1.24.4,<1.27.0",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "mypy>=1.20.1",
    "pip-audit>=2.10.0",
    "vulture>=2.16",
    "radon>=6.0.1",
    "black>=23.12.1",
    "poethepoet>=0.45.0",
    "pre-commit>=4.6.0",
    "types-pyyaml>=6.0.12.20260518",
]

[project.scripts]
loitering-detector = "loitering_detector.scripts.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loitering_detector"]

# ==============================================================================
# Development Tooling Configuration
# ==============================================================================

[tool.black]
line-length = 88
target-version = ["py312", "py313"]

[tool.ruff]
target-version = "py312"
line-length = 88
lint.select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
lint.ignore = [
    "E501", # line too long (handled by black)
]

[tool.mypy]
strict = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "test_system",
    "test_visualizer",
    "test_inference",
    "test_stream",
    "test_loitering",
    "test_alerts",
    "test_config",
    "test_results",
    "test_trackers",
    "conftest"
]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.coverage.run]
source = ["src"]
omit = [
    "**/__init__.py",
    "src/loitering_detector/scripts/*",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "pass",
    "raise NotImplementedError",
]



[tool.poe.tasks]
lint = "ruff check ."
format = "black ."
format-check = "black --check ."
typecheck = "mypy src tests"
unit-test = "pytest tests/unit --cov=src --cov-report=term-missing --cov-report=xml"
ci = { sequence = ["lint", "format-check", "typecheck", "unit-test"] }

# ==============================================================================
# UV Package Manager Configurations (CPU & GPU PyTorch Resolution)
# ==============================================================================

# Declare the mutually exclusive extras to allow separate lockfile resolutions.
# This prevents index conflict errors on shared platform targets (e.g. Linux).
[tool.uv]
conflicts = [
  [ { extra = "cpu" }, { extra = "gpu" } ],
  [ { extra = "gui" }, { extra = "headless" } ]
]

# Route PyTorch packages to respective indexes based on the active extra.
[tool.uv.sources]
torch = [
  { index = "pytorch-gpu", extra = "gpu" },
  { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
  { index = "pytorch-gpu", extra = "gpu" },
  { index = "pytorch-cpu", extra = "cpu" },
]

# Custom index repositories for specialized PyTorch wheel builds.
# 'explicit = true' stops uv searching these indexes for general dependencies.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
